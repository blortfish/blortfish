	<title>DOM Placement</title>
<script type="text/javascript">
//<![CDATA[

	function $( which )
	{
		return document.getElementById( which );
	}
	
	function $$( which )
	{
		return document.getElementsByTagName( which );
	}
	
	function changeMe(){
		$('text');
		$$('div');

		var textNode = document.createTextNode( 'New Text' );
		hEle.appendChild( textNode );

	}
	
//]]>
</script>
</head>
