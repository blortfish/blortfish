<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>DOM Creation</title>
	
	<script>
		var ie7 = false;
	</script>
	
	<!--[if lt IE 8]>
	<script>
		ie7 = true;
	</script>
	<![endif]-->
	
	
		
<script type="text/javascript">
	
//<![CDATA[
	//some possible methods/props you will use! (know them!)
	//createElement, setAttribute, appendChild, replaceChild, createTextNode, childNodes[], firstChild, 
	//nodeType, nodeName, nodeValue, getElementById, getElementsByTagName
	var mybody;
	
	if( ie7 )
	{
		console.log('using ie7');
		
	}
	
	
	
	
	// does work from here on
	function createText(){
		mybody =  document.getElementsByTagName('body')[0];
		
		var hele = document.createElement('h2');
		hele.setAttribute('id', 'rawr');
		hele.setAttribute('style', 'color:green;');
		var text = document.createTextNode('rawrrrrrrr!!!');
		hele.appendChild(text);
		mybody.appendChild(hele);
		
		var image = document.createElement('img');
		image.setAttribute('src', 'california.jpg');
		mybody.appendChild(image);
		mybody.appendChild(document.createElement('br'));
		var button = document.createElement('button');
		button.setAttribute('id', 'remove-btn');
		button.setAttribute('onclick', 'this.parentNode.removeChild(this)');
		button.appendChild(document.createTextNode('Click me now!'));
		mybody.appendChild(button);
		
		if ( ie7 ){
			document.getElementById('rawr').style.color='yellow';
		}
	}
	
	function removeStuff(){
		console.log(document.images[0].parentNode.firstChild);
		document.images[0].parentNode.removeChild();
	}
	
//]]>
</script>
</head>
<body>
<div id="buttons" style="position:absolute; top:8px; left:200px">
  <button onclick="createText();">Create It!</button>        
</div>
<body>
</html>
