<!doctype html>
<html lang='en'>
<head>
	<meta charset='utf-8' />
	<title>SMIL Stuff</title>
</head>
<body>
	<svg xmlns="http://www.w3.org/2000/svg"
	     xmlns:xlink="http://www.w3.org/1999/xlink"
	     version="1.1" baseProfile="full" width="400" height="400">
		<style type="text/css">
			<![CDATA[
			.button
			{
				fill:red;
				stroke: #000;
				stroke-width: 5px;
			}
			.text
			{
				fill: white;
				stroke:white;
				font-size: 18px;
				font-family: arial;
				text-rendering: "geometricPrecision";
			}
			]]>
		</style>
		
		<!--Your SVG content goes here -->
		
		<a xlink:href="http://rit.edu" id="bigButton">
			
			<rect class="button" rx="10px" ry="30px" x="20px" y="20px" width="110px" height="50px">
			
			<animate attributeType="CSS" attributeName="fill"
			from="red" to="blue" dur="0.1s" begin="mouseover" fill="freeze" />
			<animate attributeType="CSS" attributeName="fill"
			from="blue" to="red" dur="0.1s" begin="mouseout" fill="freeze" />
			</rect>
			
			<text x="37px"  y="50px" class="text" id="myText"> Push </text>
			
		</a>
		
	</svg>

</body>
</html>
