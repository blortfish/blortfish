<!doctype html>
<html lang='en'>
<head>
	<meta charset='utf-8' />
	<title>SVG Primitives</title>
</head>
<body>
	<svg xmlns="http://www.w3.org/2000/svg"
	     xmlns:xlink="http://www.w3.org/1999/xlink"
	     version="1.1" baseProfile="full" width="600px" height="500px">
			
		<!--Your SVG content goes here -->
		<rect x="5px" y="5px" width="220px" height="220px" fill="green" stroke="#990000" stroke-width="5px" />
		
		<line x1="427px" y1="65px" x2="" y2="" stroke="#000" />
		
		<circle cx="320px" cy="100" r="89px" fill="orange" stroke="red" stroke-width="3px" opacity="0.8" /> 
		
		<ellipse cx="320px" cy="100" rx="180px" ry="30px" fill="#939" stroke="red" />
		
		<polyline points="223,123 276,213 171,213" fill="none" stroke="blue" stroke-width="10px" onmouseover="alert('mouse')"/>
		
		<path d="M100,300 C25,200 475,200 400,300 z" stroke-width="10px" fill="none" stroke="#0ff" />
		
		<image xlink:href="RIT01.jpg" x="100px" y="100px" height="138px" width="200px"/>
		
		<!-- Reusable -->
		<defs>
			<rect x="5px" y="5px" width="220px" height="220px" fill="green" stroke="#990000" id="myrect" stroke-width="5px" />
			<g id="mygroup">
				<circle r="8px" fill="orange" />
				<rect width="15px" height="15px" fill="orange" />
			</g>
		</defs>
		
		<use xlink:href="#myrect" x="100px" y="100px" />
		<use xlink:href="#mygroup" x="150px" y="150px" />
	</svg>

</body>
</html>
