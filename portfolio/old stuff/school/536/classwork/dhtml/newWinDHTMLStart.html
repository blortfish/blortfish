<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>DHTML FUN</title>
  	<script type="text/javascript">
  	//<![CDATA[
    	var newWin;
    	
    	function createWin(){
		newWin = window.open('','jsRef','height=300,width=650,screenY=100,top=350');
		newWin.document.write('<h1 style="position:absolute;left:2px;" id="coolBeans">536 Rawr</h1>');
    	}
	
	function changeColor( toWhat )
	{
		newWin.document.getElementById('coolBeans').style.color = toWhat;	
	}
	
	function changeStyle(toWhat, prop)
	{
		//eval( "newWin.document.getElementById('coolBeans').style." + prop + " = '" + toWhat + "'");
		newWin.document.getElementById('coolBeans').style[prop] = toWhat;
	}
	
	function slideIt(x)
	{
		var ele = newWin.document.getElementById(x);
		if(parseInt(ele.style.left) < 500)
		{
			ele.style.left = parseInt(ele.style.left) + 3 + "px";
			setTimeout("slideIt('" + x + "' )",30);
		}
	}
	
	//]]>
  	</script>
</head>
<body>
	<a href="javascript:createWin()">click for new window</a>
	
	<br/><br/><br/>
	<form>
		<input type="button" value ="slide things" onclick="slideIt('coolBeans');" /><br/>
 		Put in a color name (or hex):<input type="text" size="30" onchange="changeColor(this.value)"/><br/>
 		Put in a font size (like 12pt):<input type="text" size="30" onchange="changeStyle(this.value, 'fontSize')   "/><br/>
 		Put in a font family:          <input type="text" size="30" onchange="changeStyle(this.value, 'fontFamily')"/><br/>
 		Put in a new left (like 100px):<input type="text" size="30" onchange="changeStyle(this.value, 'left')"/><br/>
 		Put in a new top (like 200px):<input type="text" size="30" onchange="changeStyle(this.value, 'top')"/>
	</form> 
</body>
</html>
