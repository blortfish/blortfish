<!DOCTYPE html>

<script type="text/javascript">
//<![CDATA[
    
    function createEle() {
	
	var ele = $('<input>')
	.attr('type','radio')
	.attr('name','test')
	$('input:first').before(ele);
    }
    
    $( function(){
    
	$('#selectBox').on('change',function(){
	    var len = $(this).val();
	    var html = "<table>";
	    for (var i = 0;i < len; i++)
	    {
		html+= "<tr>" +
		    "<td><input type='text' name='name"+i+"' /></td>" +
		    "<td><input type='text' name='email"+i+"' /></td>" +
		    "</tr>";
	    }
	    html += "</table>";
	    $(this).after(html);
	})
    
	$(document).on('blur','input:text', function(){
	   
	   console.log($(this).val());
	   console.log($(this).attr('name'));
	});
	
	
	$('button:lt(1)').on('click', function()
	{
	
	   $(this).replaceWith("<div>" + $(this).text() + "</div>");
	   
	});
	
	
	$('h2').click(function()
	{
	    //.show() & .hide()
	    $(this).slideUp();
	});
	
	$( 'h2:first' ).hover(function(){
	    
	    //on hover
	  
	}, function(){
	    
	    //on out
	
	});
	
	$('button:eq(3)').on('click',function(){
	    $('#show').toggle('slow');
	    $(this).next().after("<strong>Done!</strong>")
	});
	
	
    });

    
    
    
//]]>
</script>
