<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Form Play</title>
<script type="text/javascript">
//<![CDATA[
function go( which)
{
	if(which != "start")
	{
		document.location = which;
		//window.open(which);
	}
}
function color()
{
	var colorName;
	//iterate to find which is selected
	for(var i = 0; i < document.myForm.colors.length; i++)
	{
		if(document.myForm.colors[i].checked)
		{
			colorName = document.myForm.colors[i].value;
		}
	}
	document.myForm.favorite.value=colorName;
}
//]]>
</script>
</head>
<body>
    <form name="myForm">
        <select name="selectmenu"  onchange="go(this.value);">
            <option value="start">
                --Select page--
            </option>
            <option value="http://www.microsoft.com">
                Microsoft
            </option>
            <option value="http://www.altavista.com">
                Altavista
            </option>
            <option value="http://www.w3schools.com">
                W3Schools
            </option>
        </select>
        <hr />
        <p>Which did you choose?<br />
	
        <input name="colors" type="radio" id="red" value="Red" /><label for="red">Red</label>
        <input name="colors" type="radio" id="green" value="Green" /><label for="green">Green</label>
        <input name="colors" type="radio" id="blue" value="Blue" /><label for="blue">Blue</label>
        <input onclick="color();" type="button" value="Color choice" /></p>
	
        <p>Your favorite color is: <input type="text" name="favorite" placeholder="Type Here" value="" /></p>
    </form>
</body>
</html>
