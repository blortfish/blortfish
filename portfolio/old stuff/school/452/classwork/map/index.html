<!DOCTYPE HTML>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <title>OpenLayers Demo</title>
      <script src="https://maps.googleapis.com/maps/api/js?v=3.exp&sensor=false"></script>
      <script src="//ajax.googleapis.com/ajax/libs/jquery/1.11.0/jquery.min.js"></script>
    <style type="text/css">
      html, body {
          width: 100%;
          height: 100%;
          margin: 0;
      }
      #basicMap {
        width: 100%;
        height: 90%;
      }
    </style>
    <script src="OpenLayers.js" type="text/javascript"></script>
    <script type="text/javascript">
      function init() {
        map                = new OpenLayers.Map( "basicMap" );
        var mapnik         = new OpenLayers.Layer.OSM();
        var fromProjection = new OpenLayers.Projection( "EPSG:4326" );   // Transform from WGS 1984
        var toProjection   = new OpenLayers.Projection( "EPSG:900913" ); // to Spherical Mercator Projection
        var position       = new OpenLayers.LonLat( -77.68,43.08 ).transform( fromProjection, toProjection );
        var zoom           = 15;
        map.addLayer( mapnik );
        map.setCenter( position, zoom );
      }
    </script>
  </head>
  <body onload="init();">
    <div id="basicMap"></div>
    <footer>
      Longitude: <input type="number" id="longitude" placeholder="Longitude" />
      Latitude: <input type="number" id="latitide" placeholder="Latitude" />
      <input type="button" value="map me" onclick="fireMe();" />
        Address Lookup: <input type="text" id="address" placeholder="Latitude" /><input type="button" value="map me" onclick="addrLookup();" />
    </footer>
    <script type="text/javascript">

        $(document).ready(function(){
            $('#longitude').focus();
            $('#longitude').add('#latitide').keypress(function (e) {
                if (e.which == 13) {
                    e.preventDefault();
                    fireMe();
                }
            });
            $('#address').keypress(function (e) {
                if (e.which == 13) {
                    e.preventDefault();
                    addrLookup();
                }
            });
        });

      function fireMe() {
        var myLong = document.getElementById( 'longitude' ).value;
        var myLat = document.getElementById( 'latitide' ).value;
		var fromProjection = new OpenLayers.Projection( "EPSG:4326" );   // Transform from WGS 1984
        var toProjection   = new OpenLayers.Projection( "EPSG:900913" ); // to Spherical Mercator Projection
        var position       = new OpenLayers.LonLat( myLong,myLat).transform( fromProjection, toProjection );

		var markers = new OpenLayers.Layer.Markers( "Markers" );
		map.addLayer(markers);

		var size = new OpenLayers.Size(21,25);
		var offset = new OpenLayers.Pixel(-(size.w/2), -size.h);
		var icon = new OpenLayers.Icon('http://www.openlayers.org/dev/img/marker.png', size, offset);
		markers.addMarker(new OpenLayers.Marker(position,icon));
		markers.addMarker(new OpenLayers.Marker(position,icon.clone()));
		map.setCenter(position, 15 );
        codeLatLng(myLong, myLat);
      }

        function addrLookup()
        {
            var geocoder = new google.maps.Geocoder();
            var address = document.getElementById('address').value;
            geocoder.geocode( { 'address': address}, function(results, status)
            {
                if (status == google.maps.GeocoderStatus.OK)
                {
                    var geoLat = results[0].geometry.location.lat();
                    var geoLng = results[0].geometry.location.lng();
                    document.getElementById( 'longitude' ).value = geoLng;
                    document.getElementById( 'latitide' ).value = geoLat;
                    fireMe();
                }
            });
        }

        function codeLatLng(long, lat) {
          var geocoder = new google.maps.Geocoder();
          var lat = parseFloat(lat);
          var lng = parseFloat(long);
          var latlng = new google.maps.LatLng(lat, lng);
          geocoder.geocode({'latLng': latlng}, function(results, status) {
              if (status == google.maps.GeocoderStatus.OK) {
                  if (results[1]) {
                      $('#address').val(results[1].formatted_address);
                  } else {
                      $('#address').text('No results found');
                  }
              } else {
                  alert('Geocoder failed due to: ' + status);
              }
          });
      }
    </script>
  </body>
</html>
